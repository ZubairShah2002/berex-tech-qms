name: Spec Lookup

on:
  push:
    branches: [main]
    paths: ['spec-lookup/**', '.github/workflows/spec-lookup.yml']
  pull_request:
    paths: ['spec-lookup/**', '.github/workflows/spec-lookup.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server — install, typecheck, test
        working-directory: spec-lookup/server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spec_test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Web — install and build
        working-directory: spec-lookup/web
        run: |
          npm ci
          npm run build
