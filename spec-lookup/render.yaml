# Render Blueprint for the Product Specification Lookup.
# In Render: New → Blueprint → pick this repository → set "Blueprint file path"
# to spec-lookup/render.yaml.
#
# After the first deploy, log in with user "admin" and the ADMIN_PASSWORD value
# shown under the service's Environment tab, then change the password.

databases:
  - name: spec-lookup-db
    plan: basic-256mb        # paid plan: data is kept. Free databases expire after 30 days.
    databaseName: spec_lookup
    user: spec_lookup
    postgresMajorVersion: "16"

services:
  - type: web
    name: spec-lookup
    runtime: docker
    plan: starter
    dockerfilePath: ./spec-lookup/Dockerfile
    dockerContext: ./spec-lookup
    buildFilter:
      paths: ['spec-lookup/**']
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spec-lookup-db
          property: connectionString
      - key: ADMIN_USER_ID
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
