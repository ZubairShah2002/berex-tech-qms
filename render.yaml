# Render Blueprint — One-click deployment for Berex Tech QMS
#
# Deploy at: https://dashboard.render.com/select-repo?type=blueprint
# (Select this repo, Render reads this file and creates all services)
#
# After deployment:
#   Login: admin@berextech.com / Admin@123456

databases:
  - name: berex-qms-db
    plan: free
    databaseName: berexqms
    user: berexqms_app
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # Redis cache
  - type: redis
    name: berex-qms-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Combined API + Frontend (single container, single URL)
  - type: web
    name: berex-qms
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: berex-qms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: berex-qms-redis
          type: redis
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: BerexQms.Staging
      - key: Jwt__Audience
        value: BerexQms.Staging.Clients
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: FileStorage__Endpoint
        value: "disabled"
      - key: FileStorage__UseSSL
        value: "false"
